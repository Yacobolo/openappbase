version: "3"

env:
  NATS_PORT: 4222
  STATIC_DIR: "web/resources/static"

tasks:
  # The `build:` tasks below are used together for production builds of a project
  build:templ:
    cmds:
      - go tool templ generate
    sources:
      - "**/*.templ"
    generates:
      - "**/*_templ.go"

  build:styles:
    cmds:
      - go tool gotailwind -i web/resources/styles/styles.css -o $STATIC_DIR/index.css
    sources:
      - "./web/resources/**/*.{html,ts,templ,go,css}"
    generates:
      - "{{.STATIC_DIR}}/index.css"

  build:wc:
    cmds:
      - go run cmd/web/build/main.go
    sources:
      - "./web/libs/**/**/*.{html,css,ts}"
    generates:
      - "{{.STATIC_DIR}}/libs/**"

  build:
    cmds:
      - go build -tags=prod -o bin/main ./cmd/web
    deps:
      - build:templ
      - build:styles
      - build:wc

  # Use this task to debug with the delve debugger
  debug:
    cmds:
      - go tool dlv exec ./bin/main
    deps:
      - build

  # Use this task to download latest version of client libs
  download:
    cmds:
      - go run cmd/downloader/main.go

  # The `live:` tasks below are used together for development builds and will live-reload the server
  live:templ:
    cmds:
      - go tool templ generate -watch

  live:styles:
    cmds:
      - go tool gotailwind -i web/resources/styles/styles.css -o $STATIC_DIR/index.css -w

  live:wc:
    cmds:
      - go run cmd/web/build/main.go -watch

  live:server:
    cmds:
      - |
        go tool air  \
         -build.cmd "go build -tags=dev -o tmp/bin/main ./cmd/web" \
         -build.bin "tmp/bin/main" \
         -build.exclude_dir "data,node_modules,web/resources/libs/datastar/node_modules,web/resources/libs/lit/node_modules" \
         -build.include_ext "go,templ" \
         -misc.clean_on_exit "true"

  live:
    deps:
      - live:templ
      - live:styles
      - live:wc
      - live:server

  run:
    cmds:
      - ./bin/main
    deps:
      - build

  # Database migration tasks
  db:migrate:up:
    cmds:
      - goose -dir internal/store/migrations sqlite3 data/app.db up

  db:migrate:down:
    cmds:
      - goose -dir internal/store/migrations sqlite3 data/app.db down

  db:migrate:status:
    cmds:
      - goose -dir internal/store/migrations sqlite3 data/app.db status

  db:migrate:create:
    cmds:
      - goose -dir internal/store/migrations create {{.CLI_ARGS}} sql

  db:reset:
    cmds:
      - rm -f data/app.db
      - task: db:migrate:up

  # Setup development environment
  setup:
    desc: "Setup development environment (copy .env.example if needed and run migrations)"
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Creating .env from .env.example..."
          cp .env.example .env
          echo "✓ .env file created. Review and customize if needed."
        else
          echo "✓ .env file already exists."
        fi
      - task: db:migrate:up

  # Context documentation tasks
  context:toc:
    desc: "Generate Table of Contents for all markdown files in context/ subdirectories"
    cmds:
      - go run cmd/toc/main.go

  context:godoc:
    desc: "Generate Go package documentation for context/go-packages/"
    cmds:
      - go run cmd/godoc/main.go

  default:
    cmds:
      - task: live
